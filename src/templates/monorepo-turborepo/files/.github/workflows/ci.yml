name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - name: Lint, test y build (solo paquetes afectados)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="...[origin/${{ github.base_ref }}]"
          else
            FILTER="...[HEAD^1]"
          fi
          pnpm exec turbo run lint test build --filter="$FILTER"
